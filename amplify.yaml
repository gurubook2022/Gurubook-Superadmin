version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm install -g pnpm@9
        - pnpm install

    build:
      commands:
        - pnpm run build

  artifacts:
    baseDirectory: .next
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*
